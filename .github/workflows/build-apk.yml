name: Build Android APK with GPS

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Web Files & Capacitor
        run: |
          mkdir -p dist
          rsync -av --exclude='dist' --exclude='.git' --exclude='.github' --exclude='node_modules' ./ dist/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "منظومة الصيانة" "com.syana.app" --web-dir dist
          npx cap add android

      - name: Inject GPS & Location Permissions
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              data = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />
          '''

          if 'ACCESS_FINE_LOCATION' not in data:
              data = data.replace('</manifest>', permissions + '\n</manifest>')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(data)
          print('GPS Permissions added successfully!')
          "

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syana-App-GPS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
